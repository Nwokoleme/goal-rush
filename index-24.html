<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Goal Rush Naija</title>
<style>
html,body{margin:0;height:100%;background:#0b2a18;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var cv=document.getElementById('c'),g=cv.getContext('2d');
var w,h,sc,ox,oy,dpr;
function resize(){
  dpr=window.devicePixelRatio||1;w=innerWidth;h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  sc=Math.min(w/840,h/540);ox=(w-840*sc)/2;oy=(h-540*sc)/2;
}
addEventListener('resize',resize);resize();

var W=800,H=480,GY1=190,GY2=290;
var T=[{name:'NGOR LIONS',c:'#2f9bff',t:'#ffffff'},{name:'OKPALA EAGLES',c:'#ff8a1f',t:'#111111'}];
var P=[],ball={x:400,y:240,vx:0,vy:0,owner:null},score=[0,0],time=120;
var state='menu',goalT=0,lastScorer=0,endT=0,ctrl=null;
var input={dx:0,dy:0,shootQ:false,passQ:false};
var keys={};
var stick={id:null,ox:0,oy:0,x:0,y:0};
var R=60;

function mk(team,role,x,y,n){return{team:team,role:role,x:x,y:y,hx:x,hy:y,fx:team?-1:1,fy:0,cd:0,hold:0,n:n};}
function kickoff(){
  P=[mk(0,'gk',28,240,1),mk(0,'f',250,160,7),mk(0,'f',250,320,10),
     mk(1,'gk',772,240,1),mk(1,'f',550,160,9),mk(1,'f',550,320,11)];
  ball={x:400,y:240,vx:0,vy:0,owner:null};
}
function newGame(){score=[0,0];time=120;kickoff();state='play';}
function startIfNeeded(){
  if(state==='menu'){newGame();}
  else if(state==='end'&&endT<=0){newGame();}
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function moveTo(p,tx,ty,sp,dt){
  var dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
  if(d>4){p.x+=dx/d*sp*dt;p.y+=dy/d*sp*dt;p.fx=dx/d;p.fy=dy/d;}
}
function kick(p,tx,ty,sp){
  var dx=tx-p.x,dy=ty-p.y,n=Math.hypot(dx,dy)||1;
  dx/=n;dy/=n;
  ball.owner=null;ball.x=p.x+dx*15;ball.y=p.y+dy*15;
  ball.vx=dx*sp;ball.vy=dy*sp;p.cd=0.4;p.fx=dx;p.fy=dy;
}
function passSp(a,b){return Math.min(560,Math.max(260,Math.hypot(a.x-b.x,a.y-b.y)*1.1+80));}
function mate(p){for(var i=0;i<P.length;i++){var q=P[i];if(q.team===p.team&&q.role==='f'&&q!==p)return q;}return null;}
function nearest(list){
  var best=null;
  for(var i=0;i<list.length;i++){if(!best||dist(list[i],ball)<dist(best,ball))best=list[i];}
  return best;
}
function goal(team){
  score[team]++;lastScorer=team;state='goal';goalT=1.6;
}

function update(dt){
  time-=dt;
  if(time<=0){time=0;state='end';endT=0.8;return;}

  var homeF=P.filter(function(p){return p.team===0&&p.role==='f';});
  if(ball.owner&&ball.owner.team===0&&ball.owner.role==='f')ctrl=ball.owner;
  else ctrl=nearest(homeF);

  var chaser=[null,null];
  var mateHome=homeF.filter(function(p){return p!==ctrl;})[0];
  if(mateHome&&dist(mateHome,ball)<160)chaser[0]=mateHome;
  chaser[1]=nearest(P.filter(function(p){return p.team===1&&p.role==='f';}));

  for(var i=0;i<P.length;i++){
    var p=P[i];
    p.cd=Math.max(0,p.cd-dt);p.hold=Math.max(0,p.hold-dt);
    var own=ball.owner,mine=own&&own.team===p.team;

    if(p.role==='gk'){
      var ty=Math.max(GY1+10,Math.min(GY2-10,ball.y));
      moveTo(p,p.hx,ty,135,dt);
      if(own===p&&p.hold<=0){var m=mate(p);kick(p,m.x,m.y,passSp(p,m));}
      continue;
    }
    if(p===ctrl){
      var sp1=(own===p)?135:155;
      var ix=input.dx,iy=input.dy,mg=Math.hypot(ix,iy);
      if(mg>0.15){
        var k=Math.min(1,mg);
        p.x+=ix/mg*sp1*k*dt;p.y+=iy/mg*sp1*k*dt;
        p.fx=ix/mg;p.fy=iy/mg;
      }
      continue;
    }
    var sp=(own===p)?112:122;
    var gx=p.team?0:W;
    if(own===p){
      moveTo(p,gx,240+Math.sin(time*1.3+p.n)*70,sp,dt);
      var dg=Math.abs(p.x-gx);
      if(p.hold<=0&&dg<240&&Math.random()<dt*3){
        kick(p,gx,200+Math.random()*80,600);
      }else if(p.hold<=0&&Math.random()<dt*0.6){
        var m2=mate(p);if(m2)kick(p,m2.x,m2.y,passSp(p,m2));
      }
    }else if(mine){
      moveTo(p,Math.max(40,Math.min(W-40,own.x+(p.team?-90:90))),p.hy,sp,dt);
    }else if(chaser[p.team]===p){
      var tg=own||ball;moveTo(p,tg.x,tg.y,sp,dt);
    }else{
      moveTo(p,p.hx+(ball.x-W/2)*0.3,p.hy,sp,dt);
    }
  }

  // your buttons
  if(input.shootQ){
    input.shootQ=false;
    if(ctrl&&(ball.owner===ctrl||(!ball.owner&&dist(ctrl,ball)<28))){
      kick(ctrl,W,240+ctrl.fy*60+(Math.random()-0.5)*20,640);
    }
  }
  if(input.passQ){
    input.passQ=false;
    var mm=ctrl?mate(ctrl):null;
    if(mm&&(ball.owner===ctrl||(!ball.owner&&dist(ctrl,ball)<28))){
      kick(ctrl,mm.x+mm.fx*30,mm.y+mm.fy*30,passSp(ctrl,mm));
    }
  }

  // keep players on the pitch
  for(var j=0;j<P.length;j++){
    var q=P[j];
    q.x=Math.max(8,Math.min(W-8,q.x));
    q.y=Math.max(8,Math.min(H-8,q.y));
  }

  // ball
  if(ball.owner){
    var o=ball.owner;
    ball.x=o.x+o.fx*13;ball.y=o.y+o.fy*13;ball.vx=0;ball.vy=0;
  }else{
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    var f=Math.pow(0.35,dt);ball.vx*=f;ball.vy*=f;
    if(ball.y<6){ball.y=6;ball.vy=Math.abs(ball.vy)*0.7;}
    if(ball.y>H-6){ball.y=H-6;ball.vy=-Math.abs(ball.vy)*0.7;}
  }
  var inGoal=ball.y>GY1&&ball.y<GY2;
  if(ball.x<0&&inGoal){goal(1);return;}
  if(ball.x>W&&inGoal){goal(0);return;}
  if(!ball.owner){
    if(ball.x<6&&!inGoal){ball.x=6;ball.vx=Math.abs(ball.vx)*0.7;}
    if(ball.x>W-6&&!inGoal){ball.x=W-6;ball.vx=-Math.abs(ball.vx)*0.7;}
  }

  // pick up and tackle
  for(var n=0;n<P.length;n++){
    var a=P[n];
    if(a.cd>0)continue;
    var d=dist(a,ball),r=a.role==='gk'?24:16;
    if(!ball.owner){
      if(d<r){ball.owner=a;a.hold=0.35;}
    }else if(ball.owner.team!==a.team&&d<r&&Math.random()<dt*4){
      ball.owner.cd=0.6;ball.owner=a;a.hold=0.35;
    }
  }
}

// ---------- drawing ----------
function circle(x,y,r,fill,stroke,lw){
  g.beginPath();g.arc(x,y,r,0,Math.PI*2);
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.lineWidth=lw||2;g.strokeStyle=stroke;g.stroke();}
}
function drawPitch(){
  for(var i=0;i<8;i++){g.fillStyle=(i%2)?'#1f7a3d':'#238544';g.fillRect(i*100,0,100,H);}
  g.strokeStyle='rgba(255,255,255,0.9)';g.lineWidth=3;
  g.strokeRect(0,0,W,H);
  g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();
  g.beginPath();g.arc(W/2,H/2,55,0,Math.PI*2);g.stroke();
  g.strokeRect(0,140,110,200);g.strokeRect(W-110,140,110,200);
  g.fillStyle='rgba(255,255,255,0.25)';
  g.fillRect(-18,GY1,18,GY2-GY1);g.fillRect(W,GY1,18,GY2-GY1);
  g.strokeRect(-18,GY1,18,GY2-GY1);g.strokeRect(W,GY1,18,GY2-GY1);
}
function drawPlayers(){
  for(var i=0;i<P.length;i++){
    var p=P[i],tm=T[p.team];
    circle(p.x+2,p.y+4,11,'rgba(0,0,0,0.25)');
    var col=p.role==='gk'?'#ffd84a':tm.c;
    circle(p.x,p.y,11,col,'#ffffff',2);
    g.fillStyle=p.role==='gk'?'#111':tm.t;
    g.font='bold 11px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText(p.n,p.x,p.y+1);
    if(p===ctrl&&(state==='play'||state==='goal')){
      circle(p.x,p.y,16,null,'#ffe14a',3);
    }
  }
  circle(ball.x+2,ball.y+3,6,'rgba(0,0,0,0.3)');
  circle(ball.x,ball.y,6,'#ffffff','#222222',1.5);
}
function drawHUD(){
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#ffffff';g.font='bold 22px system-ui,sans-serif';
  g.fillText(T[0].name+'  '+score[0]+' - '+score[1]+'  '+T[1].name,420,24);
  var m=Math.floor(time/60),s=Math.floor(time%60);
  g.font='bold 16px system-ui,sans-serif';g.fillStyle='#ffe14a';
  g.fillText(m+':'+(s<10?'0':'')+s,420,46);
}
function overlay(lines){
  g.fillStyle='rgba(5,25,12,0.82)';g.fillRect(0,0,840,540);
  g.textAlign='center';g.textBaseline='middle';
  for(var i=0;i<lines.length;i++){
    var L=lines[i];
    g.fillStyle=L.c||'#fff';g.font=L.f;g.fillText(L.t,420,L.y);
  }
}
function btns(){
  var br=Math.min(48,h*0.13);
  return{
    shoot:{x:w-br*1.7,y:h-br*1.8,r:br},
    pass:{x:w-br*3.9,y:h-br*1.2,r:br*0.85}
  };
}
function hit(b,x,y){return Math.hypot(x-b.x,y-b.y)<=b.r*1.15;}
function drawControls(){
  var b=btns();
  g.textAlign='center';g.textBaseline='middle';
  circle(b.shoot.x,b.shoot.y,b.shoot.r,'rgba(255,120,40,0.55)','rgba(255,255,255,0.8)',3);
  circle(b.pass.x,b.pass.y,b.pass.r,'rgba(47,155,255,0.55)','rgba(255,255,255,0.8)',3);
  g.fillStyle='#fff';
  g.font='bold '+Math.round(b.shoot.r*0.36)+'px system-ui,sans-serif';
  g.fillText('SHOOT',b.shoot.x,b.shoot.y);
  g.font='bold '+Math.round(b.pass.r*0.4)+'px system-ui,sans-serif';
  g.fillText('PASS',b.pass.x,b.pass.y);
  var cx,cy,kx,ky;
  if(stick.id!==null){
    cx=stick.ox;cy=stick.oy;
    var dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.hypot(dx,dy);
    if(d>R){dx=dx/d*R;dy=dy/d*R;}
    kx=cx+dx;ky=cy+dy;
  }else{cx=R*1.7;cy=h-R*1.7;kx=cx;ky=cy;}
  circle(cx,cy,R,'rgba(255,255,255,0.12)','rgba(255,255,255,0.55)',3);
  circle(kx,ky,R*0.45,'rgba(255,255,255,0.55)');
}
function draw(){
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#0b2a18';g.fillRect(0,0,w,h);
  g.save();g.translate(ox,oy);g.scale(sc,sc);
  g.save();g.translate(20,60);
  drawPitch();drawPlayers();
  if(state==='goal'){
    g.textAlign='center';g.textBaseline='middle';
    g.font='bold 90px system-ui,sans-serif';
    g.fillStyle='#ffe14a';g.strokeStyle='#000';g.lineWidth=6;
    g.strokeText('GOAL!',W/2,H/2);g.fillText('GOAL!',W/2,H/2);
    g.font='bold 24px system-ui,sans-serif';g.fillStyle='#fff';
    g.fillText(T[lastScorer].name,W/2,H/2+60);
  }
  g.restore();
  drawHUD();
  if(state==='menu'){
    overlay([
      {t:'GOAL RUSH NAIJA',f:'bold 54px system-ui,sans-serif',y:150,c:'#ffe14a'},
      {t:'Ngor Lions vs Okpala Eagles',f:'bold 22px system-ui,sans-serif',y:215},
      {t:'Left thumb: move.  Right thumb: PASS and SHOOT.',f:'18px system-ui,sans-serif',y:275},
      {t:'Turn your phone sideways.  2 minutes.  Score more goals!',f:'18px system-ui,sans-serif',y:305},
      {t:'TAP TO KICK OFF',f:'bold 34px system-ui,sans-serif',y:390,c:'#7dff9a'}
    ]);
  }
  if(state==='end'){
    var res=score[0]>score[1]?'You win!':(score[0]<score[1]?'Eagles win':'Draw');
    overlay([
      {t:'FULL TIME',f:'bold 48px system-ui,sans-serif',y:160,c:'#ffe14a'},
      {t:score[0]+' - '+score[1],f:'bold 70px system-ui,sans-serif',y:240},
      {t:res,f:'bold 30px system-ui,sans-serif',y:310},
      {t:'TAP TO PLAY AGAIN',f:'bold 30px system-ui,sans-serif',y:390,c:'#7dff9a'}
    ]);
  }
  g.restore();
  if(state==='play'||state==='goal')drawControls();
}

// ---------- input ----------
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(state!=='play'){startIfNeeded();return;}
  var x=e.clientX,y=e.clientY,b=btns();
  if(hit(b.shoot,x,y)){input.shootQ=true;return;}
  if(hit(b.pass,x,y)){input.passQ=true;return;}
  if(stick.id===null&&x<w*0.55){
    stick.id=e.pointerId;stick.ox=stick.x=x;stick.oy=stick.y=y;
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  }
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY;}
});
function release(e){if(e.pointerId===stick.id)stick.id=null;}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();keys[k]=true;
  if(k===' ')input.shootQ=true;
  if(k==='z')input.passQ=true;
  startIfNeeded();
});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
function readInput(){
  if(stick.id!==null){
    var dx=(stick.x-stick.ox)/R,dy=(stick.y-stick.oy)/R,m=Math.hypot(dx,dy);
    if(m>1){dx/=m;dy/=m;}
    input.dx=dx;input.dy=dy;
  }else{
    input.dx=((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);
    input.dy=((keys['s']||keys['arrowdown'])?1:0)-((keys['w']||keys['arrowup'])?1:0);
  }
}

// ---------- loop ----------
var last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  readInput();
  if(state==='play')update(dt);
  else if(state==='goal'){
    goalT-=dt;
    if(goalT<=0){kickoff();state='play';}
  }else if(state==='end'){endT=Math.max(0,endT-dt);}
  draw();
  requestAnimationFrame(frame);
}
kickoff();
requestAnimationFrame(frame);
</script>
</body>
</html>
