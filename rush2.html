<canvas id="c"></canvas>
<script>
'use strict';
var cv=document.getElementById('c'),g=cv.getContext('2d');
var w=0,h=0,sc=1,LW=960,LH=540,dpr=1;
function resize(){
  dpr=window.devicePixelRatio||1;w=innerWidth;h=innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  sc=Math.min(h/540,w/960);LW=w/sc;LH=h/sc;
}
addEventListener('resize',resize);resize();

// ---------- saved data ----------
var store={
  get:function(k,d){try{var v=localStorage.getItem('grn_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem('grn_'+k,JSON.stringify(v));}catch(e){}}
};
var coins=store.get('coins',0),unlocked=store.get('unlocked',0),seenTut=store.get('hasSeenTutorial',false);

// ---------- data ----------
var W=1200,H=700,GY1=275,GY2=425,Z=0.9;
var TEAMS=[
  {n:'NGOR LIONS',c:'#2f9bff',t:'#ffffff',s:74},
  {n:'OKPALA EAGLES',c:'#ff8a1f',t:'#111111',s:72},
  {n:'OWERRI STARS',c:'#ffd23f',t:'#111111',s:70},
  {n:'IMO RANGERS',c:'#d62839',t:'#ffffff',s:71},
  {n:'EKE WARRIORS',c:'#7b4fd0',t:'#ffffff',s:69},
  {n:'MBAISE KINGS',c:'#f0f0f0',t:'#111111',s:73},
  {n:'HEARTLAND SHARKS',c:'#1d3a6e',t:'#ffffff',s:68},
  {n:'AVUTU GIANTS',c:'#ff6fae',t:'#111111',s:67}
];
var CUPS=['NAIJA CUP','IMO CUP','EASTERN CUP','HEARTLAND CUP','SUPER CUP','CHAMPIONS CUP','LEGENDS CUP','GOLDEN CUP'];
var FORM={
  '433':[[.04,.5,'gk'],[.2,.14,'d'],[.2,.38,'d'],[.2,.62,'d'],[.2,.86,'d'],[.42,.25,'m'],[.42,.5,'m'],[.42,.75,'m'],[.66,.2,'f'],[.7,.5,'f'],[.66,.8,'f']],
  '442':[[.04,.5,'gk'],[.2,.14,'d'],[.2,.38,'d'],[.2,.62,'d'],[.2,.86,'d'],[.42,.14,'m'],[.42,.38,'m'],[.42,.62,'m'],[.42,.86,'m'],[.68,.36,'f'],[.68,.64,'f']]
};
function cupPrize(i){return 100*(i+1);}
function diffFor(i){return 0.74+0.05*i;}

// ---------- state ----------
var scene='menu',modal=null,mode='ai',cup=0,me=0,form='433';
var teamsRound=[],round=0,lastRes=null;
var M=null,P=[],ball={x:W/2,y:H/2,vx:0,vy:0,owner:null},ctrl=null;
if(!seenTut)modal='howto';

// ---------- helpers ----------
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rr(x,y,bw,bh,r,fill,stroke,lw){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+bw-r,y);g.quadraticCurveTo(x+bw,y,x+bw,y+r);
  g.lineTo(x+bw,y+bh-r);g.quadraticCurveTo(x+bw,y+bh,x+bw-r,y+bh);g.lineTo(x+r,y+bh);
  g.quadraticCurveTo(x,y+bh,x,y+bh-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.lineWidth=lw||2;g.strokeStyle=stroke;g.stroke();}
}
function txt(s,x,y,size,col,al,wt){
  g.font=(wt||'bold')+' '+size+'px system-ui,sans-serif';
  g.fillStyle=col||'#fff';g.textAlign=al||'center';g.textBaseline='middle';g.fillText(s,x,y);
}
function circle(x,y,r,fill,stroke,lw){
  g.beginPath();g.arc(x,y,r,0,Math.PI*2);
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.lineWidth=lw||2;g.strokeStyle=stroke;g.stroke();}
}
var ui=[];
function btn(label,x,y,bw,bh,o,fn){
  o=o||{};
  ui.push({x:x-bw/2,y:y-bh/2,w:bw,h:bh,fn:o.off?null:fn});
  rr(x-bw/2,y-bh/2,bw,bh,14,o.off?'rgba(255,255,255,0.08)':(o.col||'#1f7a3d'),
     o.off?'rgba(255,255,255,0.2)':(o.stroke||'rgba(255,255,255,0.7)'),o.sel?4:2);
  var tc=o.off?'rgba(255,255,255,0.4)':(o.tc||'#ffffff');
  txt(label,x,o.sub?y-9:y+1,o.fs||22,tc);
  if(o.sub)txt(o.sub,x,y+15,13,tc,'center','normal');
}

// ---------- sound ----------
var AC=null,crowdGain=null,fullTried=false;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
    crowdGain=AC.createGain();crowdGain.gain.value=0;
    src.connect(f);f.connect(crowdGain);crowdGain.connect(AC.destination);src.start();
  }catch(e){AC=null;}
}
function tone(fq,dur,type,vol,slide){
  try{
    if(!AC)return;
    var o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||'sine';o.frequency.value=fq;
    if(slide)o.frequency.linearRampToValueAtTime(fq+slide,AC.currentTime+dur);
    gn.gain.value=vol||0.1;gn.gain.linearRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
function goFull(){
  try{
    var el=document.documentElement;
    var p=el.requestFullscreen?el.requestFullscreen():null;
    if(p&&p.then)p.then(function(){
      if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});
    }).catch(function(){});
  }catch(e){}
}

// ---------- crowd picture (made once) ----------
var crowd=document.createElement('canvas');
crowd.width=W+300;crowd.height=H+300;
(function(){
  var c=crowd.getContext('2d');
  c.fillStyle='#16202c';c.fillRect(0,0,crowd.width,crowd.height);
  var cols=['#e63946','#f1faee','#ffd23f','#2f9bff','#ff8a1f','#7b4fd0','#2ec4b6'];
  for(var i=0;i<5000;i++){
    c.globalAlpha=0.55;c.fillStyle=cols[i%cols.length];
    c.fillRect(Math.random()*crowd.width,Math.random()*crowd.height,4,5);
  }
  c.globalAlpha=1;c.fillStyle='#14451f';c.fillRect(110,110,W+80,H+80);
})();

// ---------- match setup ----------
function mk(team,role,fx,fy,n){
  var x=team?(1-fx)*W:fx*W;
  return{team:team,role:role,x:x,y:fy*H,hx:x,hy:fy*H,fx:team?-1:1,fy:0,cd:0,hold:0,n:n,dash:0,shield:0,skCd:0};
}
function buildTeams(f0,f1){
  P=[];var a=FORM[f0],b=FORM[f1],i;
  for(i=0;i<11;i++)P.push(mk(0,a[i][2],a[i][0],a[i][1],i+1));
  for(i=0;i<11;i++)P.push(mk(1,b[i][2],b[i][0],b[i][1],i+1));
}
function kickoff(team){
  var i,p;
  for(i=0;i<P.length;i++){
    p=P[i];p.x=p.hx;p.y=p.hy;p.fx=p.team?-1:1;p.fy=0;p.cd=0;p.hold=0;p.dash=0;p.shield=0;
    if(p.role!=='gk'){
      if(p.team===0)p.x=Math.min(p.x,W/2-40);else p.x=Math.max(p.x,W/2+40);
    }
  }
  var best=null;
  for(i=0;i<P.length;i++){
    var q=P[i];
    if(q.team===team&&q.role==='f'&&(!best||Math.abs(q.y-H/2)<Math.abs(best.y-H/2)))best=q;
  }
  best.x=W/2+(team?18:-18);best.y=H/2;best.hold=0.5;
  ball={x:best.x+best.fx*13,y:best.y,vx:0,vy:0,owner:best};
}
function startMatch(home,away,f,diff,dur,sudden){
  M={home:home,away:away,hs:0,as:0,time:dur,dur:dur,sudden:sudden,state:'ready',st:1.6,extra:false,
     paused:false,diff:diff,push:Math.random()<0.02,pushAt:15+Math.random()*Math.max(1,dur-35),
     pushDone:false,conceded:0,scorer:0,cx:W/2,cy:H/2};
  buildTeams(f,Math.random()<0.5?'433':'442');
  kickoff(0);
  ctrl=null;
  scene='match';
}

// ---------- ball and players ----------
function moveTo(p,tx,ty,sp,dt){
  var dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
  if(d>5){p.x+=dx/d*sp*dt;p.y+=dy/d*sp*dt;p.fx=dx/d;p.fy=dy/d;}
}
function kick(p,tx,ty,sp){
  var dx=tx-p.x,dy=ty-p.y,n=Math.hypot(dx,dy)||1;
  dx/=n;dy/=n;
  ball.owner=null;ball.x=p.x+dx*20;ball.y=p.y+dy*20;
  ball.vx=dx*sp;ball.vy=dy*sp;p.cd=0.4;p.fx=dx;p.fy=dy;
  tone(140,0.08,'square',0.12);
}
function passSp(x1,y1,x2,y2){return clamp(Math.hypot(x2-x1,y2-y1)*1.1+90,300,820);}
function nearest(list){
  var best=null;
  for(var i=0;i<list.length;i++){if(!best||dist(list[i],ball)<dist(best,ball))best=list[i];}
  return best;
}
function oppNear(q,r){
  for(var i=0;i<P.length;i++){if(P[i].team!==q.team&&dist(P[i],q)<r)return true;}
  return false;
}
function canKick(p){return ball.owner===p||(!ball.owner&&dist(p,ball)<34);}
function bestPass(p){
  var dir=p.team?-1:1,best=null,bs=-1e9;
  for(var i=0;i<P.length;i++){
    var q=P[i];
    if(q.team!==p.team||q===p||q.role==='gk')continue;
    var d=dist(p,q);
    if(d<80||d>560)continue;
    var s=(q.x-p.x)*dir-d*0.15-(oppNear(q,55)?160:0);
    if(s>bs){bs=s;best=q;}
  }
  return best;
}
function passUser(p,through){
  if(!p||!canKick(p))return;
  var best=null,bs=-1e9,fallback=null,i,q,dx,dy,d,s;
  for(i=0;i<P.length;i++){
    q=P[i];
    if(q.team!==0||q===p||q.role==='gk')continue;
    dx=q.x-p.x;dy=q.y-p.y;d=Math.hypot(dx,dy)||1;
    if(!fallback||d<dist(p,fallback))fallback=q;
    if(through){
      if(dx<30)continue;
      s=dx-Math.abs(dy)*0.5-(oppNear(q,60)?150:0);
    }else{
      var dot=(dx*p.fx+dy*p.fy)/d;
      if(d>650||dot<-0.2)continue;
      s=dot*320-d*0.2-(oppNear(q,50)?60:0);
    }
    if(s>bs){bs=s;best=q;}
  }
  if(!best)best=fallback;
  if(!best)return;
  var tx=best.x,ty=best.y;
  if(through){tx+=110;ty+=best.fy*40;}else{tx+=best.fx*40;ty+=best.fy*40;}
  kick(p,tx,ty,passSp(p.x,p.y,tx,ty)*(through?1.15:1));
}
function aiOwner(p,sp,dt,diff){
  var gx=p.team?0:W;
  moveTo(p,gx,H/2+Math.sin(M.time*1.1+p.n)*130,sp,dt);
  if(p.hold>0)return;
  var dg=Math.abs(p.x-gx),press=oppNear(p,70);
  if(dg<360&&Math.random()<dt*1.3*Math.min(1.2,diff)){
    kick(p,gx,GY1+25+Math.random()*(GY2-GY1-50),760);return;
  }
  if((press&&Math.random()<dt*4)||Math.random()<dt*0.5){
    var q=bestPass(p);
    if(q)kick(p,q.x+q.fx*40,q.y+q.fy*40,passSp(p.x,p.y,q.x,q.y));
  }
}
function gkAI(p,dt,own,diff){
  var near=Math.abs(ball.x-p.hx)<560;
  var by=ball.y;
  if(!ball.owner&&near){
    var toward=(p.team?ball.vx>0:ball.vx<0);
    if(toward&&Math.abs(ball.vx)>150)by=ball.y+ball.vy/ball.vx*(p.hx-ball.x);
  }
  var ty=near?clamp(by,GY1+10,GY2-10):H/2;
  var spd=p.team?150*diff:170,dy=ty-p.y;
  if(Math.abs(dy)>3)p.y+=(dy>0?1:-1)*Math.min(Math.abs(dy),spd*dt);
  p.x=p.hx;p.fx=p.team?-1:1;p.fy=0;
  if(own===p&&p.hold<=0){
    var tgt=null,bd=1e9;
    for(var i=0;i<P.length;i++){
      var q=P[i];
      if(q.team===p.team&&q.role==='d'&&dist(p,q)<bd){bd=dist(p,q);tgt=q;}
    }
    if(tgt)kick(p,tgt.x,tgt.y,passSp(p.x,p.y,tgt.x,tgt.y));
  }
}
function goal(scorer){
  if(scorer===0)M.hs++;else M.as++;
  M.conceded=1-scorer;M.scorer=scorer;M.state='goal';M.st=2.4;
  tone(500,0.7,'triangle',0.13,500);
}
function tryPush(){
  var o=ball.owner;if(!o)return;
  var q=null,i;
  for(i=0;i<P.length;i++){
    if(P[i].team!==o.team&&P[i].role!=='gk'&&dist(P[i],o)<40){q=P[i];break;}
  }
  if(!q)return;
  M.pushDone=true;M.state='foul';M.st=3.2;
  for(i=0;i<P.length;i++){if(P[i].team!==o.team)P[i].cd=3.5;}
  o.shield=3.5;
  tone(2400,0.5,'sine',0.12);
}
function finishMatch(){M.state='end';M.st=1.6;tone(2400,0.5,'sine',0.1);}
function timeUp(){
  if(M.sudden&&M.hs===M.as&&!M.extra){
    M.extra=true;M.time=45;kickoff(0);M.state='ready';M.st=2;tone(2400,0.4,'sine',0.1);return;
  }
  finishMatch();
}

var input={dx:0,dy:0};
var Q={A:0,B:0,X:0,Y:0};

function playUpdate(dt){
  M.time-=dt;
  if(M.time<=0){M.time=0;timeUp();return;}
  if(M.push&&!M.pushDone&&!M.extra&&(M.dur-M.time)>=M.pushAt)tryPush();
  if(M.state!=='play')return;
  var diff=M.diff,own=ball.owner,i,t,p;
  var out0=P.filter(function(a){return a.team===0&&a.role!=='gk';});
  ctrl=(own&&own.team===0&&own.role!=='gk')?own:nearest(out0);
  var chase=[[],[]];
  for(t=0;t<2;t++){
    var arr=P.filter(function(a){return a.team===t&&a.role!=='gk'&&a!==ctrl;});
    arr.sort(function(a,b){return dist(a,ball)-dist(b,ball);});
    chase[t]=arr.slice(0,t===0?1:2);
  }
  for(i=0;i<P.length;i++){
    p=P[i];
    p.cd=Math.max(0,p.cd-dt);p.hold=Math.max(0,p.hold-dt);p.dash=Math.max(0,p.dash-dt);
    p.shield=Math.max(0,p.shield-dt);p.skCd=Math.max(0,p.skCd-dt);
    var dir=p.team?-1:1,mine=own&&own.team===p.team;
    var sp=(p.team?150*diff:165)*(own===p?0.92:1)*(p.dash>0?1.6:1);
    if(p.role==='gk'){gkAI(p,dt,own,diff);continue;}
    if(p===ctrl){
      var spc=(own===p?160:178)*(p.dash>0?1.6:1);
      var mg=Math.hypot(input.dx,input.dy);
      if(mg>0.15){
        var k=Math.min(1,mg);
        p.x+=input.dx/mg*spc*k*dt;p.y+=input.dy/mg*spc*k*dt;
        p.fx=input.dx/mg;p.fy=input.dy/mg;
      }
    }else if(own===p){
      aiOwner(p,sp,dt,diff);
    }else if(mine){
      var sf=p.role==='f'?1:(p.role==='m'?0.6:0.25);
      moveTo(p,clamp(p.hx+(ball.x-W/2)*0.4+dir*100*sf,40,W-40),clamp(p.hy+(ball.y-H/2)*0.2,40,H-40),sp,dt);
    }else if(chase[p.team].indexOf(p)>=0){
      var tg=own||ball;moveTo(p,tg.x,tg.y,sp,dt);
    }else{
      var sf2=p.role==='f'?0.5:(p.role==='m'?0.4:0.28);
      moveTo(p,clamp(p.hx+(ball.x-W/2)*sf2,40,W-40),clamp(p.hy+(ball.y-H/2)*0.2,40,H-40),sp,dt);
    }
  }

  // your buttons
  if(Q.B){Q.B=0;if(ctrl&&canKick(ctrl))kick(ctrl,W,H/2+ctrl.fy*70+(Math.random()-0.5)*30,780);}
  if(Q.A){Q.A=0;passUser(ctrl,false);}
  if(Q.X){Q.X=0;passUser(ctrl,true);}
  if(Q.Y){Q.Y=0;if(ctrl&&ctrl.skCd<=0){ctrl.dash=0.5;ctrl.skCd=1.3;ctrl.shield=0.5;tone(300,0.15,'sawtooth',0.06,300);}}

  // keep on pitch
  for(i=0;i<P.length;i++){
    p=P[i];
    p.x=clamp(p.x,10,W-10);p.y=clamp(p.y,10,H-10);
    if(p.role==='gk')p.x=p.hx;
  }

  // ball
  if(ball.owner){
    var o=ball.owner;
    ball.x=o.x+o.fx*14;ball.y=o.y+o.fy*14;ball.vx=0;ball.vy=0;
  }else{
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    var f=Math.pow(0.35,dt);ball.vx*=f;ball.vy*=f;
    if(ball.y<7){ball.y=7;ball.vy=Math.abs(ball.vy)*0.7;}
    if(ball.y>H-7){ball.y=H-7;ball.vy=-Math.abs(ball.vy)*0.7;}
  }
  var inGoal=ball.y>GY1&&ball.y<GY2;
  if(ball.x<0&&inGoal){goal(1);return;}
  if(ball.x>W&&inGoal){goal(0);return;}
  if(!ball.owner){
    if(ball.x<7&&!inGoal){ball.x=7;ball.vx=Math.abs(ball.vx)*0.7;}
    if(ball.x>W-7&&!inGoal){ball.x=W-7;ball.vx=-Math.abs(ball.vx)*0.7;}
  }

  // pick up and tackle
  for(i=0;i<P.length;i++){
    var a=P[i];
    if(a.cd>0)continue;
    var d=dist(a,ball),r=a.role==='gk'?36:18;
    if(!ball.owner){
      if(d<r){
        if(a.role==='gk'){
          var spd=Math.hypot(ball.vx,ball.vy);
          if(spd>480&&Math.random()<0.5){
            ball.vx*=-0.4;ball.vy+=(Math.random()-0.5)*320;a.cd=0.5;tone(200,0.1,'square',0.1);continue;
          }
        }
        ball.owner=a;a.hold=0.4;
      }
    }else if(ball.owner.team!==a.team&&d<r+6&&ball.owner.shield<=0&&
             Math.random()<dt*(a.role==='gk'?6:3.2)*(a.team?Math.min(1.2,diff):1)){
      var ow=ball.owner;ow.cd=0.7;ball.owner=a;a.hold=0.4;
    }
  }
}

function matchUpdate(dt){
  if(M.paused)return;
  if(M.state==='ready'){M.st-=dt;if(M.st<=0)M.state='play';return;}
  if(M.state==='goal'){
    M.st-=dt;
    if(M.st<=0){
      if(M.extra){finishMatch();}
      else{kickoff(M.conceded);M.state='ready';M.st=1.4;tone(2400,0.3,'sine',0.08);}
    }
    return;
  }
  if(M.state==='foul'){M.st-=dt;if(M.st<=0)M.state='play';return;}
  if(M.state==='end'){M.st-=dt;if(M.st<=0)endMatchScene();return;}
  playUpdate(dt);
}

// ---------- tournament ----------
function startTourney(){
  var o=[],i;
  for(i=0;i<8;i++)if(i!==me)o.push(i);
  shuffle(o);teamsRound=[me].concat(o);round=0;
}
function roundName(){return teamsRound.length===8?'Quarter-final':(teamsRound.length===4?'Semi-final':'Final');}
function simMatch(a,b){
  var sa=TEAMS[a].s,sb=TEAMS[b].s;
  var ga=Math.floor(Math.random()*3.2*(sa/70)),gb=Math.floor(Math.random()*3.2*(sb/70));
  var pen=false,wn;
  if(ga>gb)wn=a;else if(gb>ga)wn=b;
  else{pen=true;wn=Math.random()<sa/(sa+sb)?a:b;}
  return{ga:ga,gb:gb,w:wn,pen:pen};
}
function advance(winnerIdx){
  var next=[winnerIdx],lines=[];
  for(var i=2;i<teamsRound.length;i+=2){
    var a=teamsRound[i],b=teamsRound[i+1],s=simMatch(a,b);
    next.push(s.w);
    lines.push(TEAMS[a].n+' '+s.ga+' - '+s.gb+' '+TEAMS[b].n+(s.pen?' (pens)':''));
  }
  teamsRound=next;round++;
  return lines;
}
function endMatchScene(){
  var hs=M.hs,as=M.as,win=-1,note='';
  if(hs>as)win=0;
  else if(as>hs)win=1;
  else if(M.sudden){win=Math.random()<0.5?0:1;note='Penalties: '+TEAMS[win===0?M.home:M.away].n+' win';}
  if(M.extra&&hs!==as)note=(win===0?'You won':'You lost')+' in extra time';
  var r={home:M.home,away:M.away,hs:hs,as:as,note:note,others:[],over:false,coins:0,title:'',btn:'MENU'};
  if(mode==='ai'){
    r.coins=win===0?20:(win===-1?8:5);
    r.title=win===0?'YOU WIN!':(win===-1?'DRAW':'YOU LOSE');
  }else{
    if(win===0){
      r.coins=20+10*round;r.title='YOU WIN!';
      if(teamsRound.length===2){
        r.coins+=cupPrize(cup);r.title='CHAMPIONS!';r.over=true;
        r.note=CUPS[cup]+' is yours!';
        if(cup<7&&unlocked<cup+1){unlocked=cup+1;store.set('unlocked',unlocked);r.note+=' Next tournament unlocked.';}
      }else{
        r.others=advance(me);r.btn='NEXT ROUND';
      }
    }else{
      r.coins=5;r.title='YOU ARE OUT';r.over=true;
    }
  }
  coins+=r.coins;store.set('coins',coins);
  lastRes=r;M=null;scene='post';
}

// ---------- drawing: match ----------
function drawPitch(){
  var i;
  for(i=0;i<12;i++){g.fillStyle=(i%2)?'#1f7a3d':'#238544';g.fillRect(i*100,0,100,H);}
  g.strokeStyle='rgba(255,255,255,0.9)';g.lineWidth=4;
  g.strokeRect(0,0,W,H);
  g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();
  g.beginPath();g.arc(W/2,H/2,90,0,Math.PI*2);g.stroke();
  g.strokeRect(0,150,180,400);g.strokeRect(W-180,150,180,400);
  g.strokeRect(0,250,70,200);g.strokeRect(W-70,250,70,200);
  circle(W/2,H/2,5,'#ffffff');circle(120,H/2,4,'#ffffff');circle(W-120,H/2,4,'#ffffff');
  g.fillStyle='rgba(255,255,255,0.25)';
  g.fillRect(-30,GY1,30,GY2-GY1);g.fillRect(W,GY1,30,GY2-GY1);
  g.strokeRect(-30,GY1,30,GY2-GY1);g.strokeRect(W,GY1,30,GY2-GY1);
}
function drawPlayers(){
  for(var i=0;i<P.length;i++){
    var p=P[i],tm=TEAMS[p.team===0?M.home:M.away];
    circle(p.x+3,p.y+5,13,'rgba(0,0,0,0.25)');
    var col=p.role==='gk'?(p.team?'#7df9ff':'#ffd84a'):tm.c;
    circle(p.x,p.y,13,col,'#ffffff',2);
    circle(p.x+p.fx*8,p.y+p.fy*8,3,'rgba(0,0,0,0.35)');
    txt(String(p.n),p.x,p.y+1,12,p.role==='gk'?'#111111':tm.t);
    if(p===ctrl&&(M.state==='play'||M.state==='ready'||M.state==='foul')){
      circle(p.x,p.y,19,null,'#ffe14a',3);
      g.fillStyle='#ffe14a';g.beginPath();g.moveTo(p.x,p.y-30);g.lineTo(p.x-7,p.y-42);g.lineTo(p.x+7,p.y-42);g.closePath();g.fill();
    }
  }
  circle(ball.x+3,ball.y+4,7,'rgba(0,0,0,0.3)');
  circle(ball.x,ball.y,7,'#ffffff','#222222',1.5);
}
function banner(big,small,col){
  g.fillStyle='rgba(0,0,0,0.45)';g.fillRect(0,LH/2-70,LW,140);
  txt(big,LW/2,LH/2-12,64,col||'#ffe14a');
  if(small)txt(small,LW/2,LH/2+42,24,'#ffffff');
}
function drawHUD(){
  var cx=LW/2;
  rr(cx-240,8,480,46,12,'rgba(0,0,0,0.6)');
  txt(TEAMS[M.home].n,cx-62,31,16,'#ffffff','right');
  txt(M.hs+' - '+M.as,cx,31,28,'#ffe14a');
  txt(TEAMS[M.away].n,cx+62,31,16,'#ffffff','left');
  var tl=M.extra?('EXTRA TIME  0:'+(Math.ceil(M.time)<10?'0':'')+Math.ceil(M.time)):(Math.floor((M.dur-M.time)/M.dur*90)+"'");
  rr(cx-70,58,140,26,10,'rgba(0,0,0,0.6)');
  txt(tl,cx,71,15,'#ffe14a');
  if(!M.paused)btn('II',LW-40,32,50,44,{fs:20,col:'rgba(0,0,0,0.55)'},function(){M.paused=true;Q.A=Q.B=Q.X=Q.Y=0;stick.id=null;});
  if(M.state==='ready')banner(M.extra?'EXTRA TIME':'KICK OFF',M.extra?'Next goal wins':'',null);
  else if(M.state==='goal')banner('GOAL!',TEAMS[M.scorer===0?M.home:M.away].n,null);
  else if(M.state==='foul')banner(M.st>1.5?'PUSH!':'FREE KICK',M.st>1.5?'Referee checks VAR...':'VAR: Foul confirmed','#ff6b6b');
  else if(M.state==='end')banner('FULL TIME',M.hs===M.as&&M.sudden?'Penalties next':'',null);
  if(M.paused){
    g.fillStyle='rgba(0,0,0,0.7)';g.fillRect(0,0,LW,LH);
    txt('PAUSED',cx,110,44,'#ffe14a');
    btn('RESUME',cx,200,280,60,{fs:26,col:'#1f9d4d'},function(){M.paused=false;});
    btn('CONTROLS',cx,280,280,60,{fs:26},function(){modal='howto';});
    btn('QUIT MATCH',cx,360,280,60,{fs:26,col:'#9d1f1f'},function(){M=null;scene='menu';});
  }
}
function camUpdate(dt){
  var tx=ball.x,ty=ball.y;
  if(ball.owner)tx+=ball.owner.fx*40;
  M.cx+=(tx-M.cx)*Math.min(1,dt*5);M.cy+=(ty-M.cy)*Math.min(1,dt*5);
  var vw=LW/Z,vh=LH/Z;
  M.cx=vw>W+160?W/2:clamp(M.cx,vw/2-80,W-vw/2+80);
  M.cy=vh>H+160?H/2:clamp(M.cy,vh/2-80,H-vh/2+80);
}
function drawMatch(){
  g.fillStyle='#14451f';g.fillRect(0,0,LW,LH);
  g.save();
  g.translate(LW/2-M.cx*Z,LH/2-M.cy*Z);g.scale(Z,Z);
  g.drawImage(crowd,-150,-150);
  drawPitch();drawPlayers();
  g.restore();
  drawHUD();
}
function cbtns(){
  var br=Math.min(46,h*0.115),cx=w-br*3.0,cy=h-br*2.3,d=br*1.35,r=br*0.8;
  return{
    A:{x:cx,y:cy+d,r:r,l:'A',s:'PASS',c:'rgba(70,170,255,0.55)'},
    B:{x:cx+d,y:cy,r:r*1.1,l:'B',s:'SHOOT',c:'rgba(255,90,40,0.6)'},
    X:{x:cx-d,y:cy,r:r,l:'X',s:'THROUGH',c:'rgba(120,220,120,0.55)'},
    Y:{x:cx,y:cy-d,r:r,l:'Y',s:'SKILL',c:'rgba(255,210,60,0.55)'}
  };
}
var stick={id:null,ox:0,oy:0,x:0,y:0},R=55;
function drawControls(){
  var b=cbtns(),k;
  for(k in b){
    var o=b[k];
    circle(o.x,o.y,o.r,o.c,'rgba(255,255,255,0.85)',3);
    txt(o.l,o.x,o.y-o.r*0.18,Math.round(o.r*0.7),'#ffffff');
    txt(o.s,o.x,o.y+o.r*0.5,Math.max(8,Math.round(o.r*0.26)),'#ffffff','center','normal');
  }
  var cx,cy,kx,ky;
  if(stick.id!==null){
    cx=stick.ox;cy=stick.oy;
    var dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.hypot(dx,dy);
    if(d>R){dx=dx/d*R;dy=dy/d*R;}
    kx=cx+dx;ky=cy+dy;
  }else{cx=R*1.8;cy=h-R*1.8;kx=cx;ky=cy;}
  circle(cx,cy,R,'rgba(255,255,255,0.12)','rgba(255,255,255,0.55)',3);
  circle(kx,ky,R*0.45,'rgba(255,255,255,0.55)');
}

// ---------- input ----------
var keys={};
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  initAudio();
  if(!fullTried){fullTried=true;goFull();}
  var lx=e.clientX/sc,ly=e.clientY/sc,i;
  for(i=ui.length-1;i>=0;i--){
    var u=ui[i];
    if(u.fn&&lx>=u.x&&lx<=u.x+u.w&&ly>=u.y&&ly<=u.y+u.h){u.fn();return;}
  }
  if(modal)return;
  if(scene==='match'&&M&&!M.paused){
    var cb=cbtns(),k;
    for(k in cb){
      var b=cb[k];
      if(Math.hypot(e.clientX-b.x,e.clientY-b.y)<=b.r*1.2){Q[k]=1;return;}
    }
    if(stick.id===null&&e.clientX<w*0.5){
      stick.id=e.pointerId;stick.ox=stick.x=e.clientX;stick.oy=stick.y=e.clientY;
      try{cv.setPointerCapture(e.pointerId);}catch(er){}
    }
  }
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY;}
});
function release(e){if(e.pointerId===stick.id)stick.id=null;}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();keys[k]=true;
  if(k==='j')Q.A=1;if(k==='k')Q.B=1;if(k==='l')Q.X=1;if(k==='i')Q.Y=1;
});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
function readInput(){
  if(stick.id!==null){
    var dx=(stick.x-stick.ox)/R,dy=(stick.y-stick.oy)/R,m=Math.hypot(dx,dy);
    if(m>1){dx/=m;dy/=m;}
    input.dx=dx;input.dy=dy;
  }else{
    input.dx=((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);
    input.dy=((keys['s']||keys['arrowdown'])?1:0)-((keys['w']||keys['arrowup'])?1:0);
  }
}

// ---------- main loop ----------
var last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  requestAnimationFrame(frame);
  g.setTransform(dpr,0,0,dpr,0,0);
  if(h>w*1.05){
    g.fillStyle='#0b2a18';g.fillRect(0,0,w,h);
    g.fillStyle='#ffffff';g.font='bold '+Math.min(30,w/12)+'px system-ui,sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText('Turn your phone sideways',w/2,h/2);
    if(scene==='match'&&M)M.paused=true;
    ui=[];return;
  }
  g.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  ui=[];
  if(scene==='match'&&M){
    readInput();
    if(!modal)matchUpdate(dt);
    if(M){camUpdate(dt);drawMatch();}
  }else if(scene==='menu')drawMenu();
  else if(scene==='cups')drawCups();
  else if(scene==='team')drawTeam();
  else if(scene==='bracket')drawBracket();
  else if(scene==='post')drawPost();
  if(modal)drawModal();
  if(scene==='match'&&M&&!M.paused&&!modal){g.setTransform(dpr,0,0,dpr,0,0);drawControls();}
  if(crowdGain&&AC){
    var tgt=(scene==='match'&&M)?(M.state==='goal'?0.18:0.05):0;
    try{crowdGain.gain.setTargetAtTime(tgt,AC.currentTime,0.3);}catch(e){}
  }
}
requestAnimationFrame(frame);
</script>
